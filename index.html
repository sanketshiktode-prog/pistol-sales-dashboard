// ─── CSV PARSERS ───
function parseEmpCSV(csv) {
  const result = {};
  const rows = Papa.parse(csv, { header: true, skipEmptyLines: true }).data;
  rows.forEach(r => {
    const tl = TL_MAP[r.TL_Name?.trim()] || r.TL_Name?.trim();
    const m = MONTH_MAP[r.Month?.trim()] || r.Month?.trim();
    if (!tl || !m || !r.Employee_Name) return;
    if (!result[tl]) result[tl] = {};
    if (!result[tl][m]) result[tl][m] = [];
    const leads = cleanNum(r.Leads), ql = cleanNum(r.QL), visit = cleanNum(r.Visits), booking = cleanNum(r.Bookings);
    const spend = cleanNum(r.Total_Spend), revenue = cleanNum(r.Revenue), pipeline = cleanNum(r.Pipeline);
    result[tl][m].push({
      name: r.Employee_Name.trim(), leads, ql,
      leadToQL: leads > 0 ? Math.round(ql / leads * 1000) / 10 : 0,
      visit,
      qlToVisit: ql > 0 ? Math.round(visit / ql * 1000) / 10 : 0,
      booking,
      visitToBooking: visit > 0 ? Math.round(booking / visit * 1000) / 10 : 0,
      qlToBooking: ql > 0 ? Math.round(booking / ql * 1000) / 10 : 0,
      spend, revenue,
      roas: spend > 0 && revenue > 0 ? Math.round(revenue / spend * 100) / 100 : 0,
      pipeline,
      salary: cleanNum(r["Salary Cost"] || r[15] || 0),
      rent: cleanNum(r["Rent"] || r[16] || 0),
      roi: (() => { const sal = cleanNum(r["Salary Cost"] || r[15] || 0); const ren = cleanNum(r["Rent"] || r[16] || 0); const tot = spend + sal + ren; return tot > 0 && revenue > 0 ? Math.round(revenue / tot * 100) / 100 : 0; })(),
    });
  });
  return result;
}

function parseProjCSV(csv) {
  const result = {};
  const rows = Papa.parse(csv, { header: true, skipEmptyLines: true }).data;
  rows.forEach(r => {
    const tl = TL_MAP[r.TL_Name?.trim()] || r.TL_Name?.trim();
    const m = MONTH_MAP[r.Month?.trim()] || r.Month?.trim();
    if (!tl || !m || !r.Project_Name) return;
    if (!result[tl]) result[tl] = {};
    if (!result[tl][m]) result[tl][m] = [];
    result[tl][m].push({
      project: r.Project_Name.trim(), leads: cleanNum(r.Leads), ql: cleanNum(r.QL),
      visits: cleanNum(r.Visits), spend: cleanNum(r.Total_Spend), bookings: cleanNum(r.Bookings),
      revenue: cleanNum(r.Revenue), pipeline: cleanNum(r.Pipeline),
      developer: (r.Developer || "").trim(),
    });
  });
  return result;
}

function addTLSalariesToData(data) {
  const TL_SALARIES = {"Rahul": 161750, "Nikhil": 142977, "Kiran Kumar": 89939};
  const result = JSON.parse(JSON.stringify(data));
  Object.keys(result).forEach(tl => {
    Object.keys(result[tl]).forEach(month => {
      const tlName = tl === "Kiran Kumar" ? "Kirankumar Mashette (TL)" : tl + " Kumar (TL)";
      
      // Get the rent share from first employee in this team (all have same value)
      const employeeRent = result[tl][month].length > 0 ? (result[tl][month][0].rent || 0) : 0;
      
      result[tl][month].unshift({
        name: tlName, leads: 0, ql: 0, leadToQL: 0, visit: 0, qlToVisit: 0,
        booking: 0, visitToBooking: 0, qlToBooking: 0, spend: 0, revenue: 0,
        roas: 0, pipeline: 0, salary: TL_SALARIES[tl], rent: employeeRent, roi: 0
      });
    });
  });
  return result;
}

        else setDataSource("fallback");
      } else setDataSource("fallback");
    } catch (e) { console.warn("Sheet fetch failed, using fallback:", e); setDataSource("fallback"); }
  };

  useEffect(() => { fetchData(); const interval = setInterval(fetchData, 300000); return () => clearInterval(interval); }, []);

  return { empData, projData, dataSource, lastSync, refresh: fetchData };
}

function CellModal({ data, onClose }) {

function MetricCard({ label, value, color, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)} style={{
      background: S.card, border: "1px solid " + (hov ? color || S.accent : S.border), borderRadius: 12, padding: "18px 20px",

      <div style={{ fontSize: 22, fontWeight: 700, color: S.text, fontFamily: "'Space Grotesk',monospace" }}>{value}</div>

}

function SortBtn({ field, sortField, sortDir }) {
  const active = sortField === field;
  return <span style={{ marginLeft: 4, opacity: active ? 1 : 0.3, fontSize: 10 }}>{active && sortDir === "desc" ? "▼" : "▲"}</span>;
}

function ClickCell({ children, onClick, style }) {
  const [hov, setHov] = useState(false);
  return (
    <td onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ padding: "10px 12px", borderBottom: "1px solid " + S.border, cursor: "pointer", transition: "all 0.15s",

}

        {tab === "projects" && role !== "Employee" && (<div>
          {visibleTLs.map(tl => {
            let projs = month === "JFM" ? (() => { const pM={}; MONTHS.forEach(m=>(PROJECTS_DATA[tl]?.[m]||[]).forEach(p=>{ if(!pM[p.project])pM[p.project]={developer:p.developer,project:p.project,leads:0,ql:0,visits:0,spend:0,bookings:0,revenue:0,pipeline:0}; const o=pM[p.project];o.leads+=p.leads;o.ql+=p.ql;o.visits+=p.visits;o.spend+=p.spend;o.bookings+=p.bookings;o.revenue+=p.revenue;o.pipeline+=p.pipeline; })); return Object.values(pM); })() : month === "Total" ? (() => { const pM={}; TOTAL_MONTHS.forEach(m=>(PROJECTS_DATA[tl]?.[m]||[]).forEach(p=>{ if(!pM[p.project])pM[p.project]={developer:p.developer,project:p.project,leads:0,ql:0,visits:0,spend:0,bookings:0,revenue:0,pipeline:0}; const o=pM[p.project];o.leads+=p.leads;o.ql+=p.ql;o.visits+=p.visits;o.spend+=p.spend;o.bookings+=p.bookings;o.revenue+=p.revenue;o.pipeline+=p.pipeline; })); return Object.values(pM); })() : (PROJECTS_DATA[tl]?.[month] || []);
            if (!projs.length) return null;
            return (<div key={tl} style={{background:S.card,borderRadius:12,border:"1px solid "+S.border,overflow:"hidden",marginBottom:20}}>
              <div style={{padding:"14px 18px",borderBottom:"1px solid "+S.border,fontSize:15,fontWeight:700}}>{tl}'s Projects — <span style={{color:S.accent}}>{monthLabel}</span></div>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {[["Developer","developer"],["Project","project"],["Leads","leads"],["QL","ql"],["Visits","visits"],["Spend","spend"],["Bookings","bookings"],["Revenue","revenue"],["Pipeline","pipeline"],["ROAS","_roas"]].map(([l,f])=><TH key={f} label={l} field={f} table={"proj_"+tl} />)}
              </tr></thead><tbody>
                {getSorted("proj_"+tl, projs).map((p,i)=><tr key={i}>
                  <ClickCell style={{color:"#fbbf24",fontWeight:600}}>{p.developer||"—"}</ClickCell>
                  <ClickCell onClick={()=>openCellModal(p.project,{Developer:p.developer,TL:tl,Revenue:fmtCur(p.revenue),Pipeline:fmtCur(p.pipeline)})} style={{color:S.text,fontWeight:600,maxWidth:240}}>{p.project}</ClickCell>
                  <ClickCell>{fmt(p.leads)}</ClickCell>
                  <ClickCell style={{color:S.blue}}>{fmt(p.ql)}</ClickCell>
                  <ClickCell>{fmt(p.visits)}</ClickCell>
                  <ClickCell style={{color:S.red}}>{fmtCur(p.spend)}</ClickCell>
                  <ClickCell style={{color:S.green}}>{fmt(p.bookings)}</ClickCell>
                  <ClickCell style={{color:S.green}}>{fmtCur(p.revenue)}</ClickCell>
                  <ClickCell style={{color:"#a78bfa"}}>{fmtCur(p.pipeline)}</ClickCell>
                  <ClickCell style={{color:S.green,fontWeight:700}}>{(() => { if (p.spend <= 0) return "—"; const val = pipelineRoas ? (p.revenue + p.pipeline) : p.revenue; return val > 0 ? Math.round(val / p.spend * 100) / 100 + "x" : "—"; })()}</ClickCell>
                </tr>)}
                <tr style={{background:S.accentDim}}>
                  <td style={{padding:"12px",borderBottom:"none",fontWeight:700,color:"#fbbf24"}}>TOTAL</td>
                  <td style={{padding:"12px",borderBottom:"none"}}></td>
                  <td style={{padding:"12px",fontWeight:700,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(projs.reduce((a,p)=>a+p.leads,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.blue,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(projs.reduce((a,p)=>a+p.ql,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(projs.reduce((a,p)=>a+p.visits,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.red,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(projs.reduce((a,p)=>a+p.spend,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(projs.reduce((a,p)=>a+p.bookings,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(projs.reduce((a,p)=>a+p.revenue,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:"#a78bfa",borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(projs.reduce((a,p)=>a+p.pipeline,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{(() => { const r = projs.reduce((a,p)=>a+p.revenue,0); const pl = projs.reduce((a,p)=>a+p.pipeline,0); const s = projs.reduce((a,p)=>a+p.spend,0); if (s <= 0) return "—"; const val = pipelineRoas ? (r + pl) : r; return val > 0 ? Math.round(val / s * 100) / 100 + "x" : "—"; })()}</td>
                </tr>
              </tbody></table></div>
            </div>);
          })}
        </div>)}

        {/* ══ EMPLOYEES ══ */}
        {tab === "employees" && (<div>
          {visibleTLs.map(tl => {
            let emps = getEmps(tl, month);
            if (role === "Employee" && selectedEmp) emps = emps.filter(e => e.name === selectedEmp);
            if (!emps.length) return null;
            const tbl = "emp_" + tl;
            return (<div key={tl} style={{background:S.card,borderRadius:12,border:"1px solid "+S.border,overflow:"hidden",marginBottom:20}}>
              <div style={{padding:"14px 18px",borderBottom:"1px solid "+S.border,fontSize:15,fontWeight:700}}>{tl}'s Team — <span style={{color:S.accent}}>{monthLabel}</span> <span style={{fontSize:12,color:S.textDim,marginLeft:8}}>({emps.length})</span></div>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {[["#",null],["Employee","name"],["Leads","leads"],["QL","ql"],["L→QL%","leadToQL"],["Visits","visit"],["Bookings","booking"],["Spend","spend"],["Salary","salary"],["Rent","rent"],["Revenue","revenue"],["ROAS","roas"],["Pipeline","pipeline"],["ROI","roi"]].map(([l,f])=><TH key={l} label={l} field={f} table={tbl} />)}
              </tr></thead><tbody>
                {getSorted(tbl, emps).map((e,i)=><tr key={e.name} style={{background:e.revenue>0?"rgba(52,211,153,0.05)":"transparent"}}>
                  <td style={{padding:"10px 12px",borderBottom:"1px solid "+S.border,color:S.textDim,fontSize:12}}>{i+1}</td>
                  <ClickCell onClick={()=>openCellModal(e.name,{TL:tl,Leads:fmt(e.leads),QL:fmt(e.ql),"L→QL":fmtPct(e.leadToQL),Revenue:fmtCur(e.revenue)})} style={{color:S.text,fontWeight:600,whiteSpace:"nowrap"}}>{e.name}</ClickCell>
                  <ClickCell>{fmt(e.leads)}</ClickCell>
                  <ClickCell style={{color:S.blue}}>{fmt(e.ql)}</ClickCell>
                  <ClickCell style={{color:ratioColor(e.leadToQL),fontWeight:700}}>{fmtPct(e.leadToQL)}</ClickCell>
                  <ClickCell>{fmt(e.visit)}</ClickCell>
                  <ClickCell style={{color:S.green}}>{fmt(e.booking)}</ClickCell>
                  <ClickCell style={{color:S.red}}>{fmtCur(e.spend)}</ClickCell>
                  <ClickCell style={{color:"#fbbf24"}}>{fmtCur(e.salary||0)}</ClickCell>
                  <ClickCell style={{color:"#fbbf24"}}>{fmtCur(e.rent||0)}</ClickCell>
                  <ClickCell style={{color:e.revenue>0?S.green:S.textDim,fontWeight:e.revenue>0?700:400}}>{fmtCur(e.revenue)}</ClickCell>
                  <ClickCell style={{color:S.green,fontWeight:700}}>{(() => { if (e.spend <= 0) return "—"; const val = pipelineRoas ? (e.revenue + e.pipeline) : e.revenue; return val > 0 ? Math.round(val / e.spend * 100) / 100 + "x" : "—"; })()}</ClickCell>
                  <ClickCell style={{color:e.pipeline>0?"#a78bfa":S.textDim}}>{fmtCur(e.pipeline)}</ClickCell>
                  <ClickCell style={{color:e.roi>0?S.green:S.textDim,fontWeight:e.roi>0?700:400}}>{e.roi>0?e.roi+"x":"—"}</ClickCell>
                </tr>)}
                <tr style={{background:S.accentDim}}>
                  <td style={{padding:"12px",borderBottom:"none"}}></td>
                  <td style={{padding:"12px",fontWeight:700,color:S.accent,borderBottom:"none"}}>TOTAL</td>
                  <td style={{padding:"12px",fontWeight:700,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(emps.reduce((a,e)=>a+e.leads,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.blue,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(emps.reduce((a,e)=>a+e.ql,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.accent,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{(()=>{const l=emps.reduce((a,e)=>a+e.leads,0),q=emps.reduce((a,e)=>a+e.ql,0);return l>0?fmtPct(Math.round(q/l*1000)/10):"—";})()}</td>
                  <td style={{padding:"12px",fontWeight:700,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmt(emps.reduce((a,e)=>a+e.visit,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.red,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(emps.reduce((a,e)=>a+e.spend,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:"#fbbf24",borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(emps.reduce((a,e)=>a+(e.salary||0),0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:"#fbbf24",borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(emps.reduce((a,e)=>a+(e.rent||0),0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(emps.reduce((a,e)=>a+e.revenue,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{(() => { const r = emps.reduce((a,e)=>a+e.revenue,0); const p = emps.reduce((a,e)=>a+e.pipeline,0); const s = emps.reduce((a,e)=>a+e.spend,0); if (s <= 0) return "—"; const val = pipelineRoas ? (r + p) : r; return val > 0 ? Math.round(val / s * 100) / 100 + "x" : "—"; })()}</td>
                  <td style={{padding:"12px",fontWeight:700,color:"#a78bfa",borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{fmtCur(emps.reduce((a,e)=>a+e.pipeline,0))}</td>
                  <td style={{padding:"12px",fontWeight:700,color:S.green,borderBottom:"none",fontFamily:"'Space Grotesk',monospace",fontSize:13}}>{(()=>{const r=emps.reduce((a,e)=>a+e.revenue,0),s=emps.reduce((a,e)=>a+e.spend,0),sal=emps.reduce((a,e)=>a+(e.salary||0),0),rent=emps.reduce((a,e)=>a+(e.rent||0),0);const total=s+sal+rent;return total>0&&r>0?Math.round(r/total*100)/100+"x":"—";})()}</td>
                </tr>
              </tbody></table></div>
            </div>);
          })}
        </div>)}

        {/* ══ DEVELOPERS / MARKETING ══ */}
        {tab === "developers" && role === "Admin" && (<div>
          <div style={{background:S.card,borderRadius:12,border:"1px solid "+S.border,overflow:"hidden"}}>
            <div style={{padding:"14px 18px",borderBottom:"1px solid "+S.border,fontSize:15,fontWeight:700}}>Developer Revenue & Marketing Spend — <span style={{color:S.accent}}>{monthLabel}</span></div>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
              {[["Developer","developer"],["Projects","_projects"],["Leads","leads"],["QL","ql"],["Bookings","bookings"],["Revenue","revenue"],["Pipeline","pipeline"],["Spend","spend"],["ROAS","_roi"]].map(([l,f])=><TH key={f} label={l} field={f} table="devMkt" />)}
            </tr></thead><tbody>
              {(()=>{
                const devMap = {}; const ms = month === "JFM" ? MONTHS : month === "Total" ? TOTAL_MONTHS : [month];
                TL_LIST.forEach(tl => {
                  ms.forEach(m => (PROJECTS_DATA[tl]?.[m]||[]).forEach(p => {
                    const dev = p.developer || "Unknown";
                    if(!devMap[dev]) devMap[dev] = {developer:dev,_projects:0,_projList:[],leads:0,ql:0,bookings:0,revenue:0,pipeline:0,spend:0};
                    const o = devMap[dev];
                    if(!o._projList.includes(p.project)){o._projList.push(p.project);o._projects++;}
                    o.leads+=p.leads;o.ql+=p.ql;o.bookings+=p.bookings;o.revenue+=p.revenue;o.pipeline+=p.pipeline;o.spend+=p.spend;
                  }));
                });
                const rows = Object.values(devMap).map(d=>({...d,_roi:d.spend>0&&d.revenue>0?Math.round(d.revenue/d.spend*100)/100:0}));
                return getSorted("devMkt",rows).map((d,i)=><tr key={i} style={{background:d.revenue>0?"rgba(52,211,153,0.04)":"transparent"}}>
                  <ClickCell onClick={()=>openCellModal(d.developer,Object.fromEntries(d._projList.map((p,j)=>["Project "+(j+1),p])))} style={{color:"#fbbf24",fontWeight:700,fontSize:14}}>{d.developer}</ClickCell>
                  <ClickCell onClick={()=>openCellModal(d.developer+" — Projects",Object.fromEntries(d._projList.map((p,j)=>["#"+(j+1),p])))} style={{textAlign:"center",color:S.text}}>{d._projects}</ClickCell>
                  <ClickCell>{fmt(d.leads)}</ClickCell>
                  <ClickCell style={{color:S.blue}}>{fmt(d.ql)}</ClickCell>
                  <ClickCell style={{color:S.green}}>{fmt(d.bookings)}</ClickCell>
                  <ClickCell style={{color:d.revenue>0?S.green:S.textDim,fontWeight:d.revenue>0?700:400}}>{fmtCur(d.revenue)}</ClickCell>
                  <ClickCell style={{color:d.pipeline>0?"#a78bfa":S.textDim}}>{fmtCur(d.pipeline)}</ClickCell>
                  <ClickCell style={{color:S.red}}>{fmtCur(d.spend)}</ClickCell>
                  <ClickCell style={{color:d._roi>2?S.green:d._roi>0?"#fbbf24":S.textDim,fontWeight:700}}>{d._roi>0?d._roi+"x":"—"}</ClickCell>
                </tr>);
              })()}
            </tbody></table></div>
          </div>
        </div>)}

        {/* ══ TL COMPARISON ══ */}
        {tab === "tl_compare" && role === "Admin" && (<div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {TL_LIST.map(tl => {
            const data = {};
            [...MONTHS,"JFM"].forEach(m => {
              const e = getEmps(tl,m); const l=e.reduce((a,x)=>a+x.leads,0),q=e.reduce((a,x)=>a+x.ql,0),r=e.reduce((a,x)=>a+x.revenue,0),s=e.reduce((a,x)=>a+x.spend,0);
              data[m]={leads:l,ql:q,visit:e.reduce((a,x)=>a+x.visit,0),booking:e.reduce((a,x)=>a+x.booking,0),revenue:r,roas:s>0&&r>0?Math.round(r/s*100)/100:0,pipeline:e.reduce((a,x)=>a+x.pipeline,0),spend:s,lql:l>0?Math.round(q/l*1000)/10:0};
            });
            return (<div key={tl} style={{flex:"1 1 300px",background:S.card,borderRadius:12,border:"1px solid "+S.border,overflow:"hidden"}}>
              <div style={{padding:"14px 16px",borderBottom:"1px solid "+S.border,background:S.accentDim}}>
                <div style={{fontSize:16,fontWeight:700,color:S.accent}}>{tl}</div>
              </div>
              <div style={{padding:14}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {["","Jan","Feb","Mar","JFM"].map(h=><th key={h} style={{padding:"6px",fontSize:10,color:h==="JFM"?S.accent:S.textDim,textTransform:"uppercase",textAlign:"right",fontWeight:h==="JFM"?700:600}}>{h}</th>)}
              </tr></thead><tbody>
                {[{l:"Leads",k:"leads",c:S.text},{l:"QL",k:"ql",c:S.blue},{l:"L→QL%",k:"lql",c:S.accent,pct:true},{l:"Visits",k:"visit",c:S.text},{l:"Bookings",k:"booking",c:S.green},{l:"Revenue",k:"revenue",c:S.green,cur:true},{l:"ROAS",k:"roas",c:S.green,roas:true},{l:"Pipeline",k:"pipeline",c:"#a78bfa",cur:true},{l:"Spend",k:"spend",c:S.red,cur:true}].map(r=><tr key={r.l}>
                  <td style={{padding:"5px 6px",fontSize:11,color:S.textDim}}>{r.l}</td>
                  {[...MONTHS,"JFM"].map(m=><ClickCell key={m} onClick={()=>openCellModal(tl+" "+r.l+" ("+m+")",{Value:r.cur?fmtCur(data[m][r.k]):r.pct?fmtPct(data[m][r.k]):r.roas?(data[m][r.k]>0?data[m][r.k]+"x":"—"):fmt(data[m][r.k])})} style={{textAlign:"right",color:m==="JFM"?S.accent:r.c,fontSize:12,padding:"5px 6px",fontWeight:m==="JFM"?700:400}}>
                    {r.cur?fmtCur(data[m][r.k]):r.pct?fmtPct(data[m][r.k]):r.roas?(data[m][r.k]>0?data[m][r.k]+"x":"—"):fmt(data[m][r.k])}
                  </ClickCell>)}
                </tr>)}
              </tbody></table></div>
            </div>);
          })}
        </div>)}

        {/* ══ TOP PERFORMERS ══ */}
        {tab === "top_performers" && (()=>{
          const tls = role === "Admin" ? TL_LIST : [selectedTL];
          const empPerf = []; tls.forEach(tl=>getEmps(tl,month).forEach(e=>empPerf.push({...e,tl})));
          return (<div>
            <div style={{background:S.card,borderRadius:12,border:"1px solid "+S.border,overflow:"hidden"}}>
              <div style={{padding:"14px 18px",borderBottom:"1px solid "+S.border,display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:20}}>⭐</span><div><div style={{fontSize:15,fontWeight:700}}>Employee Leaderboard — <span style={{color:S.accent}}>{monthLabel}</span></div><div style={{fontSize:11,color:S.textDim}}>Sort by any column to find top & low performers</div></div>
              </div>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {[["Rank",null],["Employee","name"],["TL","tl"],["Leads","leads"],["QL","ql"],["L→QL%","leadToQL"],["Visits","visit"],["QL→V%","qlToVisit"],["Booking","booking"],["V→B%","visitToBooking"],["Revenue","revenue"],["Pipeline","pipeline"],["Spend","spend"],["ROAS","roas"]].map(([l,f])=><TH key={l} label={l} field={f} table="empLead" />)}
              </tr></thead><tbody>
                {getSorted("empLead",empPerf).map((e,i)=>{
                  const isTop=e.leadToQL>=40&&e.leads>=20, isLow=e.leadToQL<20&&e.leads>=20;
                  return (<tr key={e.name+e.tl} style={{background:isTop?"rgba(52,211,153,0.04)":isLow?"rgba(248,113,113,0.04)":"transparent"}}>
                    <td style={{padding:"10px 12px",borderBottom:"1px solid "+S.border,textAlign:"center"}}>{rankBadge(i)}</td>
                    <ClickCell onClick={()=>openCellModal(e.name,{TL:e.tl,Leads:fmt(e.leads),QL:fmt(e.ql),"L→QL":fmtPct(e.leadToQL),Revenue:fmtCur(e.revenue)})} style={{color:S.text,fontWeight:600,whiteSpace:"nowrap"}}>
                      {e.name} {isTop&&<span style={{fontSize:10,color:S.green,marginLeft:4}}>★ TOP</span>}{isLow&&<span style={{fontSize:10,color:S.red,marginLeft:4}}>▼ LOW</span>}
                    </ClickCell>
                    <ClickCell style={{color:S.accent,fontSize:12}}>{e.tl}</ClickCell>
                    <ClickCell>{fmt(e.leads)}</ClickCell><ClickCell style={{color:S.blue}}>{fmt(e.ql)}</ClickCell>
                    <ClickCell style={{color:ratioColor(e.leadToQL),fontWeight:700}}>{fmtPct(e.leadToQL)}</ClickCell>
                    <ClickCell>{fmt(e.visit)}</ClickCell><ClickCell style={{color:ratioColor(e.qlToVisit)}}>{fmtPct(e.qlToVisit)}</ClickCell>
                    <ClickCell style={{color:S.green}}>{fmt(e.booking)}</ClickCell><ClickCell style={{color:ratioColor(e.visitToBooking)}}>{fmtPct(e.visitToBooking)}</ClickCell>
                    <ClickCell style={{color:e.revenue>0?S.green:S.textDim,fontWeight:e.revenue>0?700:400}}>{fmtCur(e.revenue)}</ClickCell>
                    <ClickCell style={{color:e.pipeline>0?"#a78bfa":S.textDim}}>{fmtCur(e.pipeline)}</ClickCell>
                    <ClickCell style={{color:S.red}}>{fmtCur(e.spend)}</ClickCell>
                    <ClickCell style={{color:S.green,fontWeight:700}}>{(() => { if (e.spend <= 0) return "—"; const val = pipelineRoas ? (e.revenue + e.pipeline) : e.revenue; return val > 0 ? Math.round(val / e.spend * 100) / 100 + "x" : "—"; })()}</ClickCell>
                  </tr>);
                })}
              </tbody></table></div>
            </div>
          </div>);
        })()}

        <div style={{textAlign:"center",padding:"32px 0 16px",color:S.textDim,fontSize:11}}>
          Pune Operations Dashboard · Jan–Apr 2026 · {role} View · {dataSource === "live" ? "🟢 Live from Google Sheets" : "📦 Offline Data"}
        </div>
      </div>
      <CellModal data={modal} onClose={() => setModal(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
